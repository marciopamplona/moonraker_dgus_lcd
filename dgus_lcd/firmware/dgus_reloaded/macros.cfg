# "Macros" page: lists Klipper [gcode_macro]s (names starting with "_"
# and those in macro_exclude are hidden), 6 per page, and runs the one
# tapped. Macros that take parameters open the "Parameters" page (22)
# first, where numbers can be entered with the keypad. Needs the screen files built by `python -m dgus_lcd.macros_screen`
# (pages 21 and 22 + a Macros tile on the "More" page); VP addresses must match
# dgus_lcd/macros_screen.py.

[t5uid1_page macros]
id: 21
var: macros_page_indicator,
  macro_label_0_0, macro_label_0_1, macro_label_1_0, macro_label_1_1, macro_label_2_0, macro_label_2_1, macro_label_3_0, macro_label_3_1, macro_label_4_0, macro_label_4_1, macro_label_5_0, macro_label_5_1

[t5uid1_routine __macros]
trigger: enter_pre
page: macros
script:
  {% set pages = ((printer.t5uid1.macros|length + 5) // 6) or 1 %}
  {% if get_variable("macro_page", 0)|int >= pages %}
    {% do set_variable("macro_page", 0) %}
  {% endif %}

[t5uid1_var macros_page_indicator]
type: output
address: 0x5100
data_type: str
data_len: 8
script:
  {% set pages = ((printer.t5uid1.macros|length + 5) // 6) or 1 %}
  { "{:^8s}".format("%d/%d" % (get_variable("macro_page", 0)|int + 1, pages)) }

[t5uid1_var __macros_key]
type: input
address: 0x51a0
data_type: uint16
script:
  {% set t5uid1 = printer.t5uid1 %}
  {% set macros = t5uid1.macros %}
  {% set pages = ((macros|length + 5) // 6) or 1 %}
  {% set page = get_variable("macro_page", 0)|int %}
  {% if data == 7 or data == 8 %}
    {% set page = (page + (1 if data == 8 else pages - 1)) % pages %}
    {% do set_variable("macro_page", page) %}
    {% do switch_page("macros", true) %}
  {% elif data >= 1 and data <= 6 %}
    {% set idx = page * 6 + data - 1 %}
    {% if idx < macros|length %}
      {% if t5uid1.is_printing %}
        {% do set_message("Not while printing") %}
      {% elif is_busy() %}
        {% do set_message("Busy") %}
      {% elif macro_params(macros[idx])|length > 0 %}
        {% do set_variable("param_macro", macros[idx]) %}
        {% do set_variable("param_values", {}) %}
        {% do set_variable("param_page", 0) %}
        {% do switch_page("macro_params") %}
      {% else %}
        {% do set_message("Running " ~ macros[idx]) %}
        { macros[idx] }
      {% endif %}
    {% endif %}
  {% endif %}
run_as_gcode: true

[t5uid1_var macro_label_0_0]
type: output
address: 0x5110
data_type: str
data_len: 12
script:
  {% set macros = printer.t5uid1.macros %}
  {% set idx = get_variable("macro_page", 0)|int * 6 + 0 %}
  {% set text = "" %}
  {% if idx < macros|length %}
    {% set lines = (macros[idx]|replace("_", " ")|wordwrap(12, true, "\n")).split("\n") %}
    {% if lines|length > 0 %}{% set text = lines[0] %}{% endif %}
    {% if lines|length > 2 and 0 == 1 %}{% set text = text[:11] ~ "~" %}{% endif %}
  {% endif %}
  { "{:^12s}".format(text[:12]) }

