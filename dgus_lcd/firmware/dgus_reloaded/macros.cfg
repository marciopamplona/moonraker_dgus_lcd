[t5uid1_page macro_params]
id: 22
var: param_macro, param_page_indicator,
  param_name_0, param_value_0, param_name_1, param_value_1, param_name_2, param_value_2, param_name_3, param_value_3

[t5uid1_var param_macro]
type: output
address: 0x5200
data_type: str
data_len: 32
script: { "{:^32s}".format(get_variable("param_macro", "")[:32]) }

[t5uid1_var param_page_indicator]
type: output
address: 0x52a0
data_type: str
data_len: 8
script:
  {% set n = macro_params(get_variable("param_macro", ""))|length %}
  {% set pages = ((n + 3) // 4) or 1 %}
  { "{:^8s}".format("%d/%d" % (get_variable("param_page", 0)|int + 1, pages)) }

[t5uid1_var __param_key]
type: input
address: 0x52c0
data_type: uint16
script:
  {% set t5uid1 = printer.t5uid1 %}
  {% set name = get_variable("param_macro", "") %}
  {% set n = macro_params(name)|length %}
  {% set pages = ((n + 3) // 4) or 1 %}
  {% set page = get_variable("param_page", 0)|int %}
  {% if data == 1 or data == 2 %}
    {% do set_variable("param_page", (page + (1 if data == 2 else pages - 1)) % pages) %}
    {% do switch_page("macro_params", true) %}
  {% elif data == 4 %}
    {% do set_variable("param_values", {}) %}
    {% do switch_page("macro_params", true) %}
  {% elif data == 3 and name %}
    {% if t5uid1.is_printing %}
      {% do set_message("Not while printing") %}
    {% elif is_busy() %}
      {% do set_message("Busy") %}
    {% else %}
      {% do set_message("Running " ~ name) %}
      { macro_command(name, get_variable("param_values", {})) }
    {% endif %}
  {% endif %}
run_as_gcode: true

[t5uid1_var param_name_0]
type: output
address: 0x5220
data_type: str
data_len: 16
script:
  {% set params = macro_params(get_variable("param_macro", "")) %}
  {% set idx = get_variable("param_page", 0)|int * 4 + 0 %}
  { "{:<16s}".format(params[idx].name[:16] if idx < params|length else "") }

[t5uid1_var param_value_0]
type: output
address: 0x5260
data_type: str
data_len: 16
script:
  {% set params = macro_params(get_variable("param_macro", "")) %}
  {% set values = get_variable("param_values", {}) %}
  {% set idx = get_variable("param_page", 0)|int * 4 + 0 %}
  {% set text = "" %}
  {% if idx < params|length %}
    {% set p = params[idx] %}
    {% if p.name in values %}
      {% set text = format_param(values[p.name], p.type) %}
    {% elif p.default is not none %}
      {% set text = "(" ~ p.default ~ ")" %}
    {% else %}
      {% set text = "-" %}
    {% endif %}
  {% endif %}
  { "{:<16s}".format(text[:16]) }

[t5uid1_var __param_input_0]
type: input
address: 0x52b0
data_type: int32
script:
  {% set params = macro_params(get_variable("param_macro", "")) %}
  {% set idx = get_variable("param_page", 0)|int * 4 + 0 %}
  {% if idx < params|length %}
    {% set p = params[idx] %}
    {% if p.type == "str" %}
      {% do set_message("Text values can't be typed") %}
    {% else %}
      {% set values = get_variable("param_values", {}) %}
      {% do values.update({p.name: data / 100.0}) %}
      {% do set_variable("param_values", values) %}
      {% do switch_page("macro_params", true) %}
    {% endif %}
  {% endif %}

