# Optional helper macros for the DGUS LCD service.
# Add  [include dgus_macros.cfg]  to printer.cfg (requires [respond], which
# mainsail.cfg already provides).

# M300 S<sound index> P<count> V<volume> - play a sound on the touchscreen
[gcode_macro M300]
description: Play a sound on the DGUS touchscreen
gcode:
  RESPOND PREFIX=dgus MSG="sound {params.S|default(-1)|int} {params.P|default(1)|int} {params.V|default(-1)|int}"

# DGUS_PLAY_SOUND [START=<index>] [LEN=<count>] [VOLUME=<0-100>]
[gcode_macro DGUS_PLAY_SOUND]
description: Play a sound on the DGUS touchscreen
gcode:
  RESPOND PREFIX=dgus MSG="sound {params.START|default(-1)|int} {params.LEN|default(1)|int} {params.VOLUME|default(-1)|int}"
