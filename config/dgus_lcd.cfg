# DGUS Reloaded touchscreen service (moonraker_ender6_lcd)
# Restart the "dgus_lcd" service after editing this file.

[dgus_lcd]
serial: /dev/ttyS1
baud: 115200
#   Must match the screen's T5UID1.CFG. 250000 also works once
#   screen/cfg/T5UID1.CFG is flashed (docs/PROTOCOL.md, "Baud rate").
moonraker_url: ws://127.0.0.1:7125/websocket
#api_key:
#   Only needed if 127.0.0.1 is not a trusted client in moonraker.conf.
machine_name: Creality Ender-6
#update_interval: 2
#   Seconds between screen refreshes (1-10).
#volume: 75
#brightness: 100
#   Initial values (0-100). Changes made on the screen are remembered in
#   ~/printer_data/dgus_lcd/state.json and take precedence.
#boot_sound: 1
#notification_sound: 3
#   Sound index on the screen, -1 to disable.
#x_min_inset: 30
#x_max_inset: 30
#y_min_inset: 30
#y_max_inset: 30
#   Distance from the bed edges used by the manual leveling screen.
#x_min:
#x_max:
#y_min:
#y_max:
#z_min:
#z_max:
#   Optional tighter limits for moves made from the screen.
#log_level: INFO
#macro_exclude:
#   Comma-separated [gcode_macro] names to hide from the Macros screen,
#   e.g. M300, DGUS_PLAY_SOUND, PAUSE, RESUME, CANCEL_PRINT. Macros whose
#   name starts with "_" are always hidden. See docs/MACROS.md.

# Any [t5uid1_var NAME], [t5uid1_page NAME] or [t5uid1_routine NAME] section
# added here replaces the built-in one with the same name (see
# dgus_lcd/firmware/dgus_reloaded/*.cfg). Copy the whole section and edit it,
# e.g. to change what the PLA/ABS/PETG preset buttons do:
#
#[t5uid1_var __temp_preset]
#type: input
#address: 0x2010
#data_type: uint16
#script: ...
#run_as_gcode: true
